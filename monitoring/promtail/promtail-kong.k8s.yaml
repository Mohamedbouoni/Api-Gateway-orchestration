# Promtail sidecar config for kong-logger pod (K8s).
# Tails JSONL access logs written by kong-logger and pushes to Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions-kong.yaml

clients:
  - url: http://loki.ai-monitoring.svc.cluster.local:3100/loki/api/v1/push

scrape_configs:
  - job_name: kong-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: kong-access
          __path__: /var/log/kong-access/access-*.jsonl
    pipeline_stages:
      - json:
          expressions:
            api_id: apiId
            stage: stage
            status: status
            request_id: requestId
            http_method: httpMethod
            path: path
            response_latency: responseLatency
      - labels:
          api_id:
          stage:
          status:
      - timestamp:
          source: requestTimeEpoch
          format: UnixMs
          fallback_formats:
            - RFC3339Nano
            - RFC3339
          action_on_failure: skip
